<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iFusen — 自由配置ホワイトボード</title>

<!-- ============================================================ -->
<!-- STYLE                                                         -->
<!-- ============================================================ -->
<style>
  :root {
    --bg: #f4f3ef;
    --dot: rgba(0, 0, 0, 0.08);
    --toolbar-bg: rgba(255, 255, 255, 0.72);
    --toolbar-border: rgba(0, 0, 0, 0.08);
    --toolbar-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    --ink: #2b2b2b;
    --accent: #4a7dff;
    --danger: #e05a4e;
    --caret: #1a1a1a;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Yu Gothic", sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------------------------------------------------------- */
  /* Canvas / viewport                                          */
  /* ---------------------------------------------------------- */

  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    background-color: var(--bg);
    background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
    cursor: default;
  }

  /* Cursor rules go from the weakest intent to the strongest: the active tool
     picks a cursor, holding Space offers a grab, and a drag in progress wins
     over both. Later rules of equal weight override the earlier ones. */
  body.tool-note #viewport {
    cursor: copy;
  }
  /* the brush circle replaces the cursor, notes included */
  body.tool-pen #viewport,
  body.tool-eraser #viewport,
  body.tool-pen .sticky-note,
  body.tool-eraser .sticky-note,
  body.tool-pen .note-text,
  body.tool-eraser .note-text {
    cursor: none;
  }
  body.space-pan #viewport {
    cursor: grab;
  }
  body.panning #viewport,
  body.panning .sticky-note,
  body.panning .note-text {
    cursor: grabbing;
  }

  #world {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    transform-origin: 0 0;
  }

  #strokesLayer {
    position: absolute;
    left: 0;
    top: 0;
    overflow: visible;
    pointer-events: none;
  }

  /* the layer itself is transparent to the pointer; notes opt back in */
  #notesLayer {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
  }

  /* ---------------------------------------------------------- */
  /* Sticky notes                                                */
  /* ---------------------------------------------------------- */

  .sticky-note {
    position: absolute;
    /* Same as the viewport: without this, a drag started on a note is taken
       over by the browser's own touch gestures on tablets and the note snaps
       back to where it started. */
    touch-action: none;
    width: 190px;
    min-height: 150px;
    padding: 14px 14px 10px;
    border-radius: 6px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16), 0 1px 2px rgba(0, 0, 0, 0.08);
    pointer-events: auto;
    cursor: grab;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.12s ease;
  }

  .sticky-note.dragging {
    cursor: grabbing;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
    transition: none;
  }

  .sticky-note.selected {
    box-shadow: 0 0 0 2px var(--accent), 0 8px 20px rgba(0, 0, 0, 0.18);
  }

  .note-text {
    flex: 1;
    outline: none;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
    caret-color: var(--caret);
    border-radius: 4px;
  }

  .note-text:empty::before {
    content: attr(data-placeholder);
    color: rgba(0, 0, 0, 0.32);
  }

  /* Restrained cue that this note is the one currently being typed into;
     the caret itself remains the primary indicator. */
  .note-text.editing {
    cursor: text;
    -webkit-user-select: text;
    user-select: text;
    background: rgba(255, 255, 255, 0.3);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
  }

  .note-toolbar {
    position: absolute;
    top: -34px;
    left: 0;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 6px;
    background: var(--toolbar-bg);
    backdrop-filter: blur(6px);
    border: 1px solid var(--toolbar-border);
    border-radius: 20px;
    box-shadow: var(--toolbar-shadow);
  }

  .sticky-note.selected .note-toolbar {
    display: flex;
  }

  .note-color-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.15);
    cursor: pointer;
    flex: none;
  }
  .note-color-dot:hover {
    transform: scale(1.15);
  }

  .note-edit-btn {
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .note-edit-btn svg {
    width: 14px;
    height: 14px;
  }
  .note-edit-btn:hover {
    color: var(--accent);
  }

  .note-delete-btn {
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--danger);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0;
    margin-left: 2px;
    flex: none;
  }

  /* ---------------------------------------------------------- */
  /* Toolbar (top center, compact)                               */
  /* ---------------------------------------------------------- */

  #toolbar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px;
    background: var(--toolbar-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--toolbar-border);
    border-radius: 16px;
    box-shadow: var(--toolbar-shadow);
    z-index: 50;
  }

  .tool-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    color: var(--ink);
    transition: background 0.12s ease;
  }
  .tool-btn:hover {
    background: rgba(0, 0, 0, 0.06);
  }
  .tool-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .tool-btn svg {
    width: 18px;
    height: 18px;
  }

  .toolbar-sep {
    width: 1px;
    height: 22px;
    background: var(--toolbar-border);
    margin: 0 3px;
  }

  #zoomLabel {
    min-width: 42px;
    text-align: center;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: rgba(0, 0, 0, 0.55);
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------------------------------------------------------- */
  /* Clear-all button (top right, deliberately separated)        */
  /* ---------------------------------------------------------- */

  #clearAllBtn {
    position: fixed;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--toolbar-border);
    background: var(--toolbar-bg);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    box-shadow: var(--toolbar-shadow);
    color: var(--danger);
    cursor: pointer;
    z-index: 50;
  }
  #clearAllBtn:hover {
    background: rgba(224, 90, 78, 0.12);
  }
  #clearAllBtn svg {
    width: 17px;
    height: 17px;
  }

  /* ---------------------------------------------------------- */
  /* Brush cursor (pen / eraser preview)                          */
  /* ---------------------------------------------------------- */

  #brushCursor {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    border: 1.5px solid rgba(0, 0, 0, 0.55);
    background: rgba(255, 255, 255, 0.25);
    display: none;
    z-index: 40;
    transform: translate(-50%, -50%);
  }

  /* ---------------------------------------------------------- */
  /* Empty-canvas hint                                            */
  /* ---------------------------------------------------------- */

  #emptyHint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    color: rgba(0, 0, 0, 0.3);
    font-size: 14px;
    text-align: center;
    line-height: 1.8;
    z-index: 5;
  }
</style>
</head>

<body class="tool-select">

  <div id="viewport">
    <div id="world">
      <svg id="strokesLayer" width="1" height="1"></svg>
      <div id="notesLayer"></div>
    </div>
  </div>

  <div id="emptyHint">
    「付箋」ツールを選んでキャンバスをクリックすると付箋を置けます<br />
    ホイールでズーム、空白をドラッグでパンできます
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tool-btn" data-tool="select" title="選択 (V)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2.5 19 12l-6.6 1.6L9.2 19.5z" /></svg>
    </button>
    <button class="tool-btn" data-tool="note" title="付箋 (N)">

    <button class="tool-btn" data-tool="eraser" title="消しゴム (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

        <line x1="12" y1="19" x2="12" y2="22" />

    <span id="zoomLabel">100%</span>

    <button class="tool-btn" id="saveFileBtn" title="ファイルに保存 (.ifusen)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

  <!-- Clear all -->
  <button id="clearAllBtn" title="すべて消去">

      <path d="M6 7l1 13h10l1-13" />

    </svg>
  </button>

  <div id="brushCursor"></div>

<!-- ============================================================ -->
<!-- SCRIPT                                                        -->
<!-- ============================================================ -->
<script>
(function () {
  "use strict";

  /* ============================================================
   * Constants
   * ========================================================== */

  const STORAGE_KEY = "ifusen.whiteboard.v1";
  const FILE_APP_NAME = "iFusen";
  const FILE_FORMAT_VERSION = 1;
  const FILE_EXTENSION = ".ifusen";
  const MIN_ZOOM = 0.15;
  const MAX_ZOOM = 4;
  const DRAG_THRESHOLD = 3; // px, screen space
  const PEN_COLOR = "#2b2b2b";
  const PEN_WIDTH = 3; // world units
  const ERASER_RADIUS_SCREEN = 16; // px, constant on-screen size
  const MIN_POINT_DISTANCE = 2; // px, screen space: skip points too close to the previous one
  // Firefox reports wheel steps in lines instead of pixels; one notch is three
  // lines there and ~100px elsewhere, so a line is treated as ~33px.
  const PIXELS_PER_WHEEL_LINE = 33;
  const PIXELS_PER_WHEEL_PAGE = 400;

  // must match .sticky-note in the stylesheet
  const NOTE_WIDTH = 190;
  const NOTE_HEIGHT = 150;

  const TOOLS = ["select", "note", "pen", "eraser"];

  const NOTE_COLORS = [
    "#fff59d", // yellow
    "#ffab91", // coral
    "#f48fb1", // pink
    "#ce93d8", // purple
    "#90caf9", // blue
    "#a5d6a7", // green
  ];

  const SVG_NS = "http://www.w3.org/2000/svg";

  /* ============================================================
   * State
   * ========================================================== */

  let state = {
    notes: [],   // { id, x, y, color, text, rot }
    strokes: [], // { id, color, width, points: [[x,y], ...] }
    camera: { x: 0, y: 0, zoom: 1 },
  };

  let currentTool = "select";
  let selectedNoteId = null;
  let lastUsedColor = NOTE_COLORS[0];
  let pointerInViewport = false;

  /* ============================================================
   * DOM references
   * ========================================================== */

  const viewportEl = document.getElementById("viewport");
  const worldEl = document.getElementById("world");
  const svgEl = document.getElementById("strokesLayer");
  const notesLayerEl = document.getElementById("notesLayer");
  const toolbarEl = document.getElementById("toolbar");
  const zoomLabelEl = document.getElementById("zoomLabel");
  const clearAllBtn = document.getElementById("clearAllBtn");
  const resetViewBtn = document.getElementById("resetViewBtn");
  const brushCursorEl = document.getElementById("brushCursor");
  const emptyHintEl = document.getElementById("emptyHint");
  const saveFileBtn = document.getElementById("saveFileBtn");
  const loadFileBtn = document.getElementById("loadFileBtn");
  const fileInputEl = document.getElementById("fileInput");

  /* ============================================================
   * Utilities
   * ========================================================== */

  function uid(prefix) {
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  /**
   * Reads the text of an editable note. innerText keeps the line breaks the
   * browser stores as <div>/<br>; textContent would silently drop them.
   */
  function readNoteText(textEl) {
    return textEl.innerText;
  }

  /** Releases a captured pointer, ignoring pointers that were never captured. */
  function releaseCapture(el, pointerId) {
    if (el.hasPointerCapture(pointerId)) el.releasePointerCapture(pointerId);
  }

  function screenToWorld(clientX, clientY) {
    const rect = viewportEl.getBoundingClientRect();
    const sx = clientX - rect.left;
    const sy = clientY - rect.top;
    return {
      x: (sx - state.camera.x) / state.camera.zoom,
      y: (sy - state.camera.y) / state.camera.zoom,
    };
  }

  /* ============================================================
   * Persistence
   * ========================================================== */

  let saveTimer = null;
  let saveFailureReported = false;

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveStateNow, 300);
  }

  function saveStateNow() {
    clearTimeout(saveTimer);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn("iFusen: failed to save state", err);
      // Autosave silently giving up is how a day of work disappears at the next
      // reload. Say it once, then stay quiet so typing is not interrupted.
      if (!saveFailureReported) {
        saveFailureReported = true;
        window.alert(
          "自動保存できませんでした。ブラウザの保存容量が不足している可能性があります。" +
            "ツールバーの保存ボタンからファイルに書き出してください。"
        );
      }
    }
  }

  /** Copies notes/strokes/camera from a plain object into the live state. */
  function applyStateData(data) {
    state.notes = Array.isArray(data.notes) ? data.notes : [];
    state.strokes = Array.isArray(data.strokes) ? data.strokes : [];
    if (data.camera) {
      state.camera.x = data.camera.x || 0;
      state.camera.y = data.camera.y || 0;
      state.camera.zoom = clamp(data.camera.zoom || 1, MIN_ZOOM, MAX_ZOOM);
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") applyStateData(parsed);
    } catch (err) {
      console.warn("iFusen: failed to load state", err);
    }
  }

  /* ============================================================
   * File export / import ( .ifusen )
   * ========================================================== */

  function twoDigits(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  function fileTimestamp(date) {
    return (
      date.getFullYear() +
      twoDigits(date.getMonth() + 1) +
      twoDigits(date.getDate()) +
      "_" +
      twoDigits(date.getHours()) +
      twoDigits(date.getMinutes())
    );
  }

  function exportToFile() {
    const payload = {
      app: FILE_APP_NAME,
      formatVersion: FILE_FORMAT_VERSION,
      exportedAt: new Date().toISOString(),
      state: {
        notes: state.notes,
        strokes: state.strokes,
        camera: state.camera,
      },
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "iFusen_" + fileTimestamp(new Date()) + FILE_EXTENSION;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Revoking straight away cancels the download in some browsers, which looks
    // to the user like the save button simply did nothing.
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  /**
   * Checks only what render/save need to not break: correct wrapper, a
   * supported format version, and the three state fields with the right
   * container types. Returns { ok: true, data } or { ok: false, message }.
   */
  function validateIfusenPayload(parsed) {
    if (!parsed || typeof parsed !== "object") {
      return { ok: false, message: "ファイルの内容を読み取れませんでした。" };
    }
    if (parsed.app !== FILE_APP_NAME) {
      return { ok: false, message: "iFusenのファイルではないようです。" };
    }
    if (parsed.formatVersion !== FILE_FORMAT_VERSION) {
      return { ok: false, message: "対応していない形式バージョンです。" };
    }
    const data = parsed.state;
    if (!data || typeof data !== "object") {
      return { ok: false, message: "ファイルにホワイトボードのデータが含まれていません。" };
    }
    if (!Array.isArray(data.notes) || !Array.isArray(data.strokes) || !data.camera) {
      return { ok: false, message: "ファイルの内容が壊れているようです。" };
    }
    return { ok: true, data: data };
  }

  function restoreFromFile(file) {
    const reader = new FileReader();
    reader.onload = function () {
      let parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert("JSONとして読み取れないファイルです。復元を中止しました。");
        return;
      }

      const result = validateIfusenPayload(parsed);
      if (!result.ok) {
        window.alert(result.message + " 復元を中止しました。");
        return;
      }

      const ok = window.confirm(
        "現在のホワイトボードを置き換えて、選択したファイルから復元します。よろしいですか？"
      );
      if (!ok) return;

      applyStateData(result.data);
      selectedNoteId = null;
      renderAll();
      saveStateNow();
    };
    reader.onerror = function () {
      window.alert("ファイルの読み込みに失敗しました。復元を中止しました。");
    };
    reader.readAsText(file);
  }

  /* ============================================================
   * Camera
   * ========================================================== */

  function applyCamera() {
    worldEl.style.transform =
      "translate(" + state.camera.x + "px, " + state.camera.y + "px) scale(" + state.camera.zoom + ")";
    const gridSize = 32 * state.camera.zoom;
    viewportEl.style.backgroundSize = gridSize + "px " + gridSize + "px";
    viewportEl.style.backgroundPosition = state.camera.x + "px " + state.camera.y + "px";
    zoomLabelEl.textContent = Math.round(state.camera.zoom * 100) + "%";
  }

  function resetView() {
    state.camera.x = 0;
    state.camera.y = 0;
    state.camera.zoom = 1;
    applyCamera();
    scheduleSave();
  }

  function zoomAt(clientX, clientY, factor) {
    // keep the world point under the cursor pinned while the zoom changes
    const rect = viewportEl.getBoundingClientRect();
    const sx = clientX - rect.left;
    const sy = clientY - rect.top;
    const world = screenToWorld(clientX, clientY);
    const newZoom = clamp(state.camera.zoom * factor, MIN_ZOOM, MAX_ZOOM);
    state.camera.x = sx - world.x * newZoom;
    state.camera.y = sy - world.y * newZoom;
    state.camera.zoom = newZoom;
    applyCamera();
    scheduleSave();
  }

  /* ============================================================
   * Empty-state hint
   * ========================================================== */

  function updateEmptyHint() {
    const empty = state.notes.length === 0 && state.strokes.length === 0;
    emptyHintEl.style.display = empty ? "block" : "none";
  }

  /** Rebuilds the whole board from the current state (load, restore, clear). */
  function renderAll() {
    renderAllNotes();
    renderAllStrokes();
    applyCamera();
    updateEmptyHint();
  }

  /* ============================================================
   * Notes: rendering
   * ========================================================== */

  function createNoteElement(note) {
    const el = document.createElement("div");
    el.className = "sticky-note";
    el.dataset.id = note.id;
    el.style.left = note.x + "px";
    el.style.top = note.y + "px";
    el.style.background = note.color;
    el.style.transform = "rotate(" + note.rot + "deg)";
    el.title = "クリックして編集 / ドラッグで移動";

    const text = document.createElement("div");
    text.className = "note-text";
    text.setAttribute("data-placeholder", "メモを入力…");
    text.textContent = note.text || "";
    el.appendChild(text);

    const toolbar = document.createElement("div");
    toolbar.className = "note-toolbar";

    const editBtn = document.createElement("button");
    editBtn.className = "note-edit-btn";
    editBtn.title = "編集";
    editBtn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M17 3.5a2.1 2.1 0 0 1 3 3L8 18.5l-4.5 1 1-4.5Z" /></svg>';
    editBtn.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
    });
    editBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      enterEditMode(text);
    });
    toolbar.appendChild(editBtn);

    NOTE_COLORS.forEach(function (color) {
      const dot = document.createElement("div");
      dot.className = "note-color-dot";
      dot.style.background = color;
      dot.addEventListener("pointerdown", function (e) {
        e.stopPropagation();
      });
      dot.addEventListener("click", function (e) {
        e.stopPropagation();
        note.color = color;
        lastUsedColor = color;
        el.style.background = color;
        scheduleSave();
      });
      toolbar.appendChild(dot);
    });
    const delBtn = document.createElement("button");
    delBtn.className = "note-delete-btn";
    delBtn.textContent = "✕";
    delBtn.title = "削除";
    delBtn.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
    });
    delBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      deleteNote(note.id);
    });
    toolbar.appendChild(delBtn);
    el.appendChild(toolbar);

    wireNoteInteractions(el, note, text);
    notesLayerEl.appendChild(el);
    return el;
  }

  function renderAllNotes() {
    notesLayerEl.innerHTML = "";
    state.notes.forEach(function (note) {
      createNoteElement(note);
    });
  }

  /* ============================================================
   * Notes: interaction (select / drag / edit / delete)
   * ========================================================== */

  /** Pass null to clear the selection. */
  function setSelectedNote(id) {
    selectedNoteId = id;
    Array.prototype.forEach.call(notesLayerEl.children, function (el) {
      el.classList.toggle("selected", el.dataset.id === id);
    });
  }

  function bringToFront(note) {
    const idx = state.notes.indexOf(note);
    if (idx === -1 || idx === state.notes.length - 1) return;
    state.notes.splice(idx, 1);
    state.notes.push(note);
    const el = notesLayerEl.querySelector('[data-id="' + note.id + '"]');
    if (el) notesLayerEl.appendChild(el);
  }

  function deleteNote(id) {
    const idx = state.notes.findIndex(function (n) { return n.id === id; });
    if (idx !== -1) state.notes.splice(idx, 1);
    const el = notesLayerEl.querySelector('[data-id="' + id + '"]');
    if (el) el.remove();
    if (selectedNoteId === id) setSelectedNote(null);
    updateEmptyHint();
    scheduleSave();
  }

  function placeCaretAtEnd(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /** The caret position for a screen point, or null when the browser has none. */
  function caretRangeAt(clientX, clientY) {
    if (document.caretPositionFromPoint) {
      const pos = document.caretPositionFromPoint(clientX, clientY);
      if (!pos) return null;
      const range = document.createRange();
      range.setStart(pos.offsetNode, pos.offset);
      range.collapse(true);
      return range;
    }
    // Safari only has the older, non-standard spelling.
    if (document.caretRangeFromPoint) return document.caretRangeFromPoint(clientX, clientY);
    return null;
  }

  /**
   * Puts the caret where the note was clicked. The text is not editable until
   * this moment, so the browser cannot place the caret itself: without this,
   * clicking into the middle of an existing note to fix a typo jumped to the
   * end of the text instead. Falls back to the end when the click landed
   * outside the text (the note's margin, or an empty note).
   */
  function placeCaretAtPoint(el, clientX, clientY) {
    const range = caretRangeAt(clientX, clientY);
    if (!range || !el.contains(range.startContainer)) {
      placeCaretAtEnd(el);
      return;
    }
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /** Pass the click coordinates to start typing there rather than at the end. */
  function enterEditMode(textEl, clientX, clientY) {
    // Already editing: keep the caret where the user put it.
    if (textEl.classList.contains("editing")) {
      textEl.focus();
      return;
    }
    textEl.classList.add("editing");
    textEl.contentEditable = "true";
    textEl.focus();
    if (typeof clientX === "number") placeCaretAtPoint(textEl, clientX, clientY);
    else placeCaretAtEnd(textEl);
  }

  function exitEditMode(textEl) {
    textEl.classList.remove("editing");
    textEl.contentEditable = "false";
  }

  function wireNoteInteractions(el, note, textEl) {
    let dragging = false;
    let dragPointerId = null;
    let moved = false;
    let startScreen = { x: 0, y: 0 };
    let startWorld = { x: 0, y: 0 };

    el.addEventListener("pointerdown", function (e) {
      // Only the primary button drags. A right-click used to start a drag that
      // no pointerup ever ended, leaving the note glued to the cursor.
      if (e.button !== 0) return;
      // Ignore a second finger while this note already owns a drag. Without
      // this guard it overwrote the starting coordinates of the first drag.
      if (dragging) {
        e.stopPropagation();
        return;
      }
      if (currentTool !== "select") return;
      if (spacePressed) return; // Space always pans, even over a note
      // Clicking inside the text being edited must place the caret, but the
      // margin around it still drags the note.
      if (textEl.classList.contains("editing") && textEl.contains(e.target)) return;
      e.stopPropagation();

      bringToFront(note);
      setSelectedNote(note.id);

      dragging = true;
      dragPointerId = e.pointerId;
      moved = false;
      startScreen = { x: e.clientX, y: e.clientY };
      startWorld = { x: note.x, y: note.y };
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener("pointermove", function (e) {
      if (!dragging || e.pointerId !== dragPointerId) return;
      // No button held any more: the release happened somewhere we never heard
      // about (switching windows mid-drag is the usual way). Finish the drag
      // here, or the note keeps following a pointer that is merely hovering.
      if (e.buttons === 0) {
        if (releaseDrag(e)) scheduleSave();
        return;
      }
      const dx = e.clientX - startScreen.x;
      const dy = e.clientY - startScreen.y;
      if (!moved && Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) {
        moved = true;
        el.classList.add("dragging");
      }
      if (moved) {
        note.x = startWorld.x + dx / state.camera.zoom;
        note.y = startWorld.y + dy / state.camera.zoom;
        el.style.left = note.x + "px";
        el.style.top = note.y + "px";
      }
    });

    function releaseDrag(e) {
      const positionChanged = moved;
      dragging = false;
      dragPointerId = null;
      el.classList.remove("dragging");
      releaseCapture(el, e.pointerId);
      return positionChanged;
    }

    el.addEventListener("pointerup", function (e) {
      if (!dragging || e.pointerId !== dragPointerId) return;
      const wasMoved = releaseDrag(e);
      if (wasMoved) {
        scheduleSave();
      } else {
        // Pointer went down and up again without crossing the drag threshold:
        // treat it as a click on the note and start editing its text.
        enterEditMode(textEl, e.clientX, e.clientY);
      }
    });

    el.addEventListener("pointercancel", function (e) {
      if (!dragging || e.pointerId !== dragPointerId) return;
      // A cancellation can happen after the note has visibly moved (for
      // example when the OS takes over a touch gesture). Keep that position
      // in autosave just as a normal pointerup would.
      if (releaseDrag(e)) scheduleSave();
    });

    // Keep the model in step with every keystroke: waiting for blur would lose
    // whatever is being typed when the tab is closed or reloaded.
    textEl.addEventListener("input", function () {
      note.text = readNoteText(textEl);
      scheduleSave();
    });

    // Paste as plain text so copied formatting (Word, Excel, web pages)
    // does not end up as markup inside the note.
    textEl.addEventListener("paste", function (e) {
      if (!e.clipboardData) return;
      e.preventDefault();
      document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
    });

    textEl.addEventListener("blur", function () {
      if (textEl.classList.contains("editing")) exitEditMode(textEl);
    });
  }

  function createNoteAt(worldX, worldY) {
    // drop the note centred on the click
    const note = {
      id: uid("note"),
      x: worldX - NOTE_WIDTH / 2,
      y: worldY - NOTE_HEIGHT / 2,
      color: lastUsedColor,
      text: "",
      rot: Math.round((Math.random() * 4 - 2) * 10) / 10,
    };
    state.notes.push(note); // last in the array is topmost
    const el = createNoteElement(note);
    setSelectedNote(note.id);
    updateEmptyHint();
    scheduleSave();

    setTool("select");
    enterEditMode(el.querySelector(".note-text"));
  }

  /* ============================================================
   * Drawing: pen & eraser
   * ========================================================== */

  let isDrawing = false;
  let activeStroke = null;
  let activePolyline = null;
  // Points of the stroke being drawn, kept as a string so each new point is
  // appended instead of re-serialising the whole stroke on every move event.
  let activePointsText = "";

  function pointToText(point) {
    return point[0] + "," + point[1];
  }

  function createPolylineElement(stroke) {
    const poly = document.createElementNS(SVG_NS, "polyline");
    poly.setAttribute("stroke", stroke.color);
    poly.setAttribute("stroke-width", stroke.width);
    poly.setAttribute("fill", "none");
    poly.setAttribute("stroke-linecap", "round");
    poly.setAttribute("stroke-linejoin", "round");
    poly.setAttribute("points", stroke.points.map(pointToText).join(" "));
    poly.dataset.id = stroke.id;
    return poly;
  }

  function startStroke(worldPoint) {
    activeStroke = {
      id: uid("stroke"),
      color: PEN_COLOR,
      width: PEN_WIDTH,
      points: [[worldPoint.x, worldPoint.y]],
    };
    activePointsText = pointToText(activeStroke.points[0]);
    activePolyline = createPolylineElement(activeStroke);
    svgEl.appendChild(activePolyline);
  }

  function extendStroke(worldPoint) {
    if (!activeStroke) return;
    const last = activeStroke.points[activeStroke.points.length - 1];
    // Ignore movements smaller than a couple of screen pixels: they add nothing
    // visible but make long strokes heavy to draw and to save.
    const dx = (worldPoint.x - last[0]) * state.camera.zoom;
    const dy = (worldPoint.y - last[1]) * state.camera.zoom;
    if (dx * dx + dy * dy < MIN_POINT_DISTANCE * MIN_POINT_DISTANCE) return;

    const point = [worldPoint.x, worldPoint.y];
    activeStroke.points.push(point);
    activePointsText += " " + pointToText(point);
    activePolyline.setAttribute("points", activePointsText);
  }

  function endStroke() {
    if (!activeStroke) return;
    if (activeStroke.points.length === 1) {
      // single-point "tap" — drop a tiny dot so the click is not silently lost
      const first = activeStroke.points[0];
      activeStroke.points.push([first[0] + 0.1, first[1] + 0.1]);
      activePolyline.setAttribute("points", activeStroke.points.map(pointToText).join(" "));
    }
    state.strokes.push(activeStroke);
    activeStroke = null;
    activePolyline = null;
    activePointsText = "";
    updateEmptyHint();
    scheduleSave();
  }

  function renderAllStrokes() {
    svgEl.innerHTML = "";
    state.strokes.forEach(function (stroke) {
      svgEl.appendChild(createPolylineElement(stroke));
    });
  }

  /** Squared distance from a point to the segment a–b. */
  function distanceToSegmentSq(px, py, ax, ay, bx, by) {
    const vx = bx - ax;
    const vy = by - ay;
    const lengthSq = vx * vx + vy * vy;
    const t = lengthSq === 0 ? 0 : clamp(((px - ax) * vx + (py - ay) * vy) / lengthSq, 0, 1);
    const dx = px - (ax + t * vx);
    const dy = py - (ay + t * vy);
    return dx * dx + dy * dy;
  }

  /**
   * True when the eraser circle touches the stroke. The segments are tested,
   * not just the recorded points: a quickly drawn line has its points far
   * apart and would otherwise slip through the eraser.
   */
  function strokeIsWithin(stroke, worldPoint, radiusSq) {
    const points = stroke.points;
    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1];
      const b = points[i];
      if (distanceToSegmentSq(worldPoint.x, worldPoint.y, a[0], a[1], b[0], b[1]) <= radiusSq) {
        return true;
      }
    }
    return false;
  }

  function eraseNear(worldPoint) {
    const radius = ERASER_RADIUS_SCREEN / state.camera.zoom;
    const radiusSq = radius * radius;
    let changed = false;

    for (let i = state.strokes.length - 1; i >= 0; i--) {
      const stroke = state.strokes[i];
      if (!strokeIsWithin(stroke, worldPoint, radiusSq)) continue;
      state.strokes.splice(i, 1);
      const el = svgEl.querySelector('[data-id="' + stroke.id + '"]');
      if (el) el.remove();
      changed = true;
    }

    if (changed) {
      updateEmptyHint();
      scheduleSave();
    }
  }

  /* ============================================================
   * Tool switching
   * ========================================================== */

  function setTool(tool) {
    currentTool = tool;
    TOOLS.forEach(function (name) {
      document.body.classList.toggle("tool-" + name, name === tool);
    });

    Array.prototype.forEach.call(toolbarEl.querySelectorAll(".tool-btn[data-tool]"), function (btn) {
      btn.classList.toggle("active", btn.dataset.tool === tool);
    });

    if (tool !== "select") setSelectedNote(null);

    updateBrushCursor();
  }

  /**
   * Shows the pen/eraser circle at the size it will actually cover, and only
   * while the pointer is over the canvas — otherwise switching tools with the
   * keyboard left a stray circle in the corner of the screen.
   */
  function updateBrushCursor() {
    const usesBrush = currentTool === "pen" || currentTool === "eraser";
    brushCursorEl.style.display = usesBrush && pointerInViewport ? "block" : "none";
    if (!usesBrush) return;

    const diameter =
      currentTool === "pen" ? PEN_WIDTH * state.camera.zoom : ERASER_RADIUS_SCREEN * 2;
    brushCursorEl.style.width = Math.max(diameter, 6) + "px";
    brushCursorEl.style.height = Math.max(diameter, 6) + "px";
  }

  /* ============================================================
   * Viewport pointer handling (pan / draw / create note / select)
   * ========================================================== */

  let panning = false;
  let viewportPointerId = null;
  let panStart = { x: 0, y: 0 };
  let camStart = { x: 0, y: 0 };
  let pointerMoved = false;
  let spacePressed = false;

  function isBackgroundTarget(target) {
    return target === viewportEl || target === worldEl;
  }

  viewportEl.addEventListener("pointerdown", function (e) {
    const isMiddleButton = e.button === 1;
    // Anything but the primary or middle button (right-click, back/forward) is
    // left to the browser: acting on it started gestures that never finished,
    // because the context menu swallows the matching pointerup.
    if (e.button !== 0 && !isMiddleButton) return;
    // Pan/draw state is intentionally single-pointer. Let the pointer that
    // started the gesture finish it instead of allowing a second touch to
    // reset or terminate the first gesture.
    if (viewportPointerId !== null) return;

    pointerMoved = false;

    // Middle-button or space-drag: pan regardless of tool.
    if (isMiddleButton || spacePressed) {
      e.preventDefault(); // middle-click would otherwise start browser autoscroll
      startPan(e);
      return;
    }

    // Select and note both drag the canvas from an empty spot; a press that
    // does not move is handled on release (deselect / create note).
    if (currentTool === "select" || currentTool === "note") {
      if (isBackgroundTarget(e.target)) startPan(e);
      return;
    }

    isDrawing = true;
    viewportPointerId = e.pointerId;
    viewportEl.setPointerCapture(e.pointerId);
    const worldPoint = screenToWorld(e.clientX, e.clientY);
    if (currentTool === "pen") {
      startStroke(worldPoint);
    } else {
      eraseNear(worldPoint);
    }
  });

  function startPan(e) {
    panning = true;
    viewportPointerId = e.pointerId;
    panStart = { x: e.clientX, y: e.clientY };
    camStart = { x: state.camera.x, y: state.camera.y };
    document.body.classList.add("panning");
    viewportEl.setPointerCapture(e.pointerId);
  }

  viewportEl.addEventListener("pointermove", function (e) {
    // The pointer can already be over the canvas when the page opens, and then
    // no pointerenter is coming; without this the brush preview stayed hidden
    // until the user moved the mouse out of the window and back in.
    if (!pointerInViewport) {
      pointerInViewport = true;
      updateBrushCursor();
    }

    // brush cursor follow
    if (currentTool === "pen" || currentTool === "eraser") {
      brushCursorEl.style.left = e.clientX + "px";
      brushCursorEl.style.top = e.clientY + "px";
    }

    // Same lost release as on a note drag: without a button, the gesture is
    // over. Left running, the board panned along with an idle cursor and the
    // eraser wiped out strokes the pointer merely passed over.
    if ((panning || isDrawing) && e.pointerId === viewportPointerId && e.buttons === 0) {
      finishPointer(e);
      return;
    }

    if (panning && e.pointerId === viewportPointerId) {
      const dx = e.clientX - panStart.x;
      const dy = e.clientY - panStart.y;
      if (Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) pointerMoved = true;
      state.camera.x = camStart.x + dx;
      state.camera.y = camStart.y + dy;
      applyCamera();
      return;
    }

    if (isDrawing && e.pointerId === viewportPointerId && currentTool === "pen") {
      extendStroke(screenToWorld(e.clientX, e.clientY));
      return;
    }

    if (isDrawing && e.pointerId === viewportPointerId && currentTool === "eraser") {
      eraseNear(screenToWorld(e.clientX, e.clientY));
      return;
    }
  });

  function finishPointer(e) {
    if (e.pointerId !== viewportPointerId) return;
    if (panning) {
      panning = false;
      viewportPointerId = null;
      document.body.classList.remove("panning");
      releaseCapture(viewportEl, e.pointerId);
      if (pointerMoved) {
        scheduleSave();
      } else if (currentTool === "select") {
        setSelectedNote(null);
      }
      return;
    }
    if (isDrawing) {
      isDrawing = false;
      viewportPointerId = null;
      releaseCapture(viewportEl, e.pointerId);
      // Unconditional: switching tools mid-stroke used to skip this and the
      // line drawn so far was thrown away. endStroke does nothing when idle.
      endStroke();
    }
  }

  viewportEl.addEventListener("pointerup", finishPointer);
  viewportEl.addEventListener("pointercancel", finishPointer);

  viewportEl.addEventListener("click", function (e) {
    if (currentTool !== "note") return;
    if (!isBackgroundTarget(e.target)) return;
    if (pointerMoved) return; // the pointer was dragged (space-pan), not clicked
    const worldPoint = screenToWorld(e.clientX, e.clientY);
    createNoteAt(worldPoint.x, worldPoint.y);
  });

  // Keep the brush preview from lingering when the pointer leaves the canvas.
  viewportEl.addEventListener("pointerleave", function () {
    pointerInViewport = false;
    updateBrushCursor();
  });

  viewportEl.addEventListener("pointerenter", function () {
    pointerInViewport = true;
    updateBrushCursor();
  });

  /** Wheel steps come in pixels, lines or pages depending on the browser. */
  function wheelDeltaPixels(e) {
    if (e.deltaMode === 1) return e.deltaY * PIXELS_PER_WHEEL_LINE;
    if (e.deltaMode === 2) return e.deltaY * PIXELS_PER_WHEEL_PAGE;
    return e.deltaY;
  }

  viewportEl.addEventListener(
    "wheel",
    function (e) {
      e.preventDefault();
      const factor = Math.exp(-wheelDeltaPixels(e) * 0.0012);
      zoomAt(e.clientX, e.clientY, factor);
      updateBrushCursor();
    },
    { passive: false }
  );

  /* ============================================================
   * Toolbar wiring
   * ========================================================== */

  Array.prototype.forEach.call(toolbarEl.querySelectorAll(".tool-btn[data-tool]"), function (btn) {
    btn.addEventListener("click", function () {
      setTool(btn.dataset.tool);
    });
  });

  resetViewBtn.addEventListener("click", resetView);

  clearAllBtn.addEventListener("click", function () {
    const ok = window.confirm("すべての付箋と描画を消去します。この操作は取り消せません。よろしいですか？");
    if (!ok) return;
    state.notes = [];
    state.strokes = [];
    state.camera = { x: 0, y: 0, zoom: 1 };
    selectedNoteId = null;
    renderAll();
    saveStateNow();
  });

  saveFileBtn.addEventListener("click", exportToFile);

  loadFileBtn.addEventListener("click", function () {
    fileInputEl.click();
  });

  fileInputEl.addEventListener("change", function () {
    const file = fileInputEl.files && fileInputEl.files[0];
    fileInputEl.value = ""; // allow re-selecting the same file next time
    if (file) restoreFromFile(file);
  });

  /* ============================================================
   * Keyboard shortcuts
   * ========================================================== */

  function setSpacePan(pressed) {
    spacePressed = pressed;
    document.body.classList.toggle("space-pan", pressed);
  }

  document.addEventListener("keydown", function (e) {
    // Keys that belong to an in-progress kana/kanji conversion are the IME's,
    // not ours: Escape there means "cancel the conversion", not "stop editing".
    if (e.isComposing) return;

    // Leave browser and OS shortcuts alone (Ctrl+V, Ctrl+P, Cmd+N ...):
    // they must not be mistaken for the single-letter tool shortcuts.
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const active = document.activeElement;
    const isEditingText = active && active.isContentEditable;

    if (e.code === "Space" && !isEditingText) {
      setSpacePan(true);
      e.preventDefault();
      return;
    }

    if (isEditingText) {
      if (e.key === "Escape") active.blur();
      return;
    }

    if (e.key === "Escape") {
      setSelectedNote(null);
      return;
    }

    if ((e.key === "Delete" || e.key === "Backspace") && selectedNoteId) {
      e.preventDefault(); // Backspace would otherwise navigate back in some browsers
      deleteNote(selectedNoteId);
      return;
    }

    switch (e.key.toLowerCase()) {
      case "v":
        setTool("select");
        break;
      case "n":
        setTool("note");
        break;
      case "p":
        setTool("pen");
        break;
      case "e":
        setTool("eraser");
        break;
    }
  });

  document.addEventListener("keyup", function (e) {
    if (e.code === "Space") setSpacePan(false);
  });

  // Switching windows while Space is held never delivers the keyup, which left
  // the board stuck in pan mode: every later click dragged instead of drawing.
  window.addEventListener("blur", function () {
    setSpacePan(false);
  });

  /* ============================================================
   * Lifecycle
   * ========================================================== */

  window.addEventListener("beforeunload", saveStateNow);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveStateNow();
  });

  function init() {
    loadState();
    renderAll();
    setTool("select");
  }

  init();
})();
</script>
</body>
</html>
