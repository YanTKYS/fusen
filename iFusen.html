<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iFusen — 自由配置ホワイトボード</title>

<!-- ============================================================ -->
<!-- STYLE                                                         -->
<!-- ============================================================ -->
<style>
  :root {
    --bg: #f4f3ef;
    --dot: rgba(0, 0, 0, 0.08);
    --toolbar-bg: rgba(255, 255, 255, 0.72);
    --toolbar-border: rgba(0, 0, 0, 0.08);
    --toolbar-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    --ink: #2b2b2b;
    --accent: #4a7dff;
    --danger: #e05a4e;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Yu Gothic", sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------------------------------------------------------- */
  /* Canvas / viewport                                          */
  /* ---------------------------------------------------------- */

  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    background-color: var(--bg);
    background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
    cursor: default;
  }

  body.tool-select #viewport {
    cursor: default;
  }
  body.tool-select #viewport.panning {
    cursor: grabbing;
  }
  body.tool-note #viewport {
    cursor: copy;
  }
  body.tool-pen #viewport,
  body.tool-eraser #viewport {
    cursor: none;
  }
  body.space-pan #viewport {
    cursor: grab;
  }
  body.space-pan #viewport.panning {
    cursor: grabbing;
  }

  #world {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    transform-origin: 0 0;
  }

  #strokesLayer {
    position: absolute;
    left: 0;
    top: 0;
    overflow: visible;
    pointer-events: none;
  }

  #notesLayer {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
  }

  /* while drawing / erasing, notes must not intercept pointer events */
  body.tool-pen #notesLayer,
  body.tool-eraser #notesLayer {
    pointer-events: none;
  }
  body.tool-select #notesLayer,
  body.tool-note #notesLayer {
    pointer-events: none; /* the layer itself is transparent; children opt in */
  }

  /* ---------------------------------------------------------- */
  /* Sticky notes                                                */
  /* ---------------------------------------------------------- */

  .sticky-note {
    position: absolute;
    width: 190px;
    min-height: 150px;
    padding: 14px 14px 10px;
    border-radius: 6px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16), 0 1px 2px rgba(0, 0, 0, 0.08);
    pointer-events: auto;
    cursor: grab;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.12s ease;
  }

  .sticky-note.dragging {
    cursor: grabbing;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
    transition: none;
  }

  .sticky-note.selected {
    box-shadow: 0 0 0 2px var(--accent), 0 8px 20px rgba(0, 0, 0, 0.18);
  }

  .note-text {
    flex: 1;
    outline: none;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-y: auto;
    max-height: 220px;
    cursor: text;
  }

  .note-text:empty::before {
    content: attr(data-placeholder);
    color: rgba(0, 0, 0, 0.32);
  }

  .note-text.editing {
    cursor: text;
    -webkit-user-select: text;
    user-select: text;
  }

  .note-toolbar {
    position: absolute;
    top: -34px;
    left: 0;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 6px;
    background: var(--toolbar-bg);
    backdrop-filter: blur(6px);
    border: 1px solid var(--toolbar-border);
    border-radius: 20px;
    box-shadow: var(--toolbar-shadow);
  }

  .sticky-note.selected .note-toolbar {
    display: flex;
  }

  .note-color-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.15);
    cursor: pointer;
    flex: none;
  }
  .note-color-dot:hover {
    transform: scale(1.15);
  }

  .note-edit-btn {
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .note-edit-btn svg {
    width: 14px;
    height: 14px;
  }
  .note-edit-btn:hover {
    color: var(--accent);
  }

  .note-delete-btn {
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--danger);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0;
    margin-left: 2px;
    flex: none;
  }

  /* ---------------------------------------------------------- */
  /* Toolbar (top center, compact)                               */
  /* ---------------------------------------------------------- */

  #toolbar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px;
    background: var(--toolbar-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--toolbar-border);
    border-radius: 16px;
    box-shadow: var(--toolbar-shadow);
    z-index: 50;
  }

  .tool-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    color: var(--ink);
    transition: background 0.12s ease;
  }
  .tool-btn:hover {
    background: rgba(0, 0, 0, 0.06);
  }
  .tool-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .tool-btn svg {
    width: 18px;
    height: 18px;
  }

  .toolbar-sep {
    width: 1px;
    height: 22px;
    background: var(--toolbar-border);
    margin: 0 3px;
  }

  #zoomLabel {
    min-width: 42px;
    text-align: center;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: rgba(0, 0, 0, 0.55);
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------------------------------------------------------- */
  /* Clear-all button (top right, deliberately separated)        */
  /* ---------------------------------------------------------- */

  #clearAllBtn {
    position: fixed;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--toolbar-border);
    background: var(--toolbar-bg);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    box-shadow: var(--toolbar-shadow);
    color: var(--danger);
    cursor: pointer;
    z-index: 50;
  }
  #clearAllBtn:hover {
    background: rgba(224, 90, 78, 0.12);
  }
  #clearAllBtn svg {
    width: 17px;
    height: 17px;
  }

  /* ---------------------------------------------------------- */
  /* Brush cursor (pen / eraser preview)                          */
  /* ---------------------------------------------------------- */

  #brushCursor {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    border: 1.5px solid rgba(0, 0, 0, 0.55);
    background: rgba(255, 255, 255, 0.25);
    display: none;
    z-index: 40;
    transform: translate(-50%, -50%);
  }

  /* ---------------------------------------------------------- */
  /* Empty-canvas hint                                            */
  /* ---------------------------------------------------------- */

  #emptyHint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    color: rgba(0, 0, 0, 0.3);
    font-size: 14px;
    text-align: center;
    line-height: 1.8;
    z-index: 5;
  }
</style>
</head>

<body class="tool-select">

  <div id="viewport">
    <div id="world">
      <svg id="strokesLayer" width="1" height="1"></svg>
      <div id="notesLayer"></div>
    </div>
  </div>

  <div id="emptyHint">
    「付箋」ツールを選んでキャンバスをクリックすると付箋を置けます<br />
    ホイールでズーム、空白をドラッグでパンできます
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tool-btn" data-tool="select" title="選択 (V)">
      <svg viewBox="0 0 20 20" fill="currentColor"><polygon points="3,2 3,18 7.5,14.3 10,20.3 12.6,19.2 10.1,13.2 16,13.2" /></svg>
    </button>
    <button class="tool-btn" data-tool="note" title="付箋 (N)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">

    </button>
    <button class="tool-btn" data-tool="pen" title="ペン (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3.5a2.1 2.1 0 0 1 3 3L8 18.5l-4.5 1 1-4.5Z" />
      </svg>
    </button>
    <button class="tool-btn" data-tool="eraser" title="消しゴム (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="10" width="14" height="8" rx="1.8" transform="rotate(-28 10 14)" />

    <div class="toolbar-sep"></div>

    <button class="tool-btn" id="resetViewBtn" title="表示をリセット">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="7" />
        <line x1="12" y1="2" x2="12" y2="5" />
        <line x1="12" y1="19" x2="12" y2="22" />
        <line x1="2" y1="12" x2="5" y2="12" />
        <line x1="19" y1="12" x2="22" y2="12" />
      </svg>
    </button>
    <span id="zoomLabel">100%</span>
  </div>

  <!-- Clear all -->
  <button id="clearAllBtn" title="すべて消去">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16" />
      <path d="M9 7V4h6v3" />
      <path d="M6 7l1 13h10l1-13" />
      <line x1="10" y1="11" x2="10" y2="17" />

    </svg>
  </button>

  <div id="brushCursor"></div>

<!-- ============================================================ -->
<!-- SCRIPT                                                        -->
<!-- ============================================================ -->
<script>
(function () {
  "use strict";

  /* ============================================================
   * Constants
   * ========================================================== */

  const STORAGE_KEY = "ifusen.whiteboard.v1";
  const MIN_ZOOM = 0.15;
  const MAX_ZOOM = 4;
  const DRAG_THRESHOLD = 3; // px, screen space
  const PEN_COLOR = "#2b2b2b";
  const PEN_WIDTH = 3; // world units
  const ERASER_RADIUS_SCREEN = 16; // px, constant on-screen size

  const NOTE_COLORS = [
    "#fff59d", // yellow
    "#ffab91", // coral
    "#f48fb1", // pink
    "#ce93d8", // purple
    "#90caf9", // blue
    "#a5d6a7", // green
  ];

  const SVG_NS = "http://www.w3.org/2000/svg";

  /* ============================================================
   * State
   * ========================================================== */

  let state = {
    notes: [],   // { id, x, y, color, text, rot }
    strokes: [], // { id, color, width, points: [[x,y], ...] }
    camera: { x: 0, y: 0, zoom: 1 },
  };

  let currentTool = "select";
  let selectedNoteId = null;
  let lastUsedColor = NOTE_COLORS[0];

  /* ============================================================
   * DOM references
   * ========================================================== */

  const viewportEl = document.getElementById("viewport");
  const worldEl = document.getElementById("world");
  const svgEl = document.getElementById("strokesLayer");
  const notesLayerEl = document.getElementById("notesLayer");
  const toolbarEl = document.getElementById("toolbar");
  const zoomLabelEl = document.getElementById("zoomLabel");
  const clearAllBtn = document.getElementById("clearAllBtn");
  const resetViewBtn = document.getElementById("resetViewBtn");
  const brushCursorEl = document.getElementById("brushCursor");
  const emptyHintEl = document.getElementById("emptyHint");

  /* ============================================================
   * Utilities
   * ========================================================== */

  function uid(prefix) {
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function screenToWorld(clientX, clientY) {
    const rect = viewportEl.getBoundingClientRect();
    const sx = clientX - rect.left;
    const sy = clientY - rect.top;
    return {
      x: (sx - state.camera.x) / state.camera.zoom,
      y: (sy - state.camera.y) / state.camera.zoom,
    };
  }

  /* ============================================================
   * Persistence
   * ========================================================== */

  let saveTimer = null;

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveStateNow, 300);
  }

  function saveStateNow() {
    clearTimeout(saveTimer);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn("iFusen: failed to save state", err);
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        state.notes = Array.isArray(parsed.notes) ? parsed.notes : [];
        state.strokes = Array.isArray(parsed.strokes) ? parsed.strokes : [];
        if (parsed.camera) {
          state.camera.x = parsed.camera.x || 0;
          state.camera.y = parsed.camera.y || 0;
          state.camera.zoom = parsed.camera.zoom || 1;
        }
      }
    } catch (err) {
      console.warn("iFusen: failed to load state", err);
    }
  }

  /* ============================================================
   * Camera
   * ========================================================== */

  function applyCamera() {
    worldEl.style.transform =
      "translate(" + state.camera.x + "px, " + state.camera.y + "px) scale(" + state.camera.zoom + ")";
    const gridSize = 32 * state.camera.zoom;
    viewportEl.style.backgroundSize = gridSize + "px " + gridSize + "px";
    viewportEl.style.backgroundPosition = state.camera.x + "px " + state.camera.y + "px";
    zoomLabelEl.textContent = Math.round(state.camera.zoom * 100) + "%";
  }

  function resetView() {
    state.camera.x = 0;
    state.camera.y = 0;
    state.camera.zoom = 1;
    applyCamera();
    scheduleSave();
  }

  function zoomAt(clientX, clientY, factor) {
    const rect = viewportEl.getBoundingClientRect();
    const sx = clientX - rect.left;
    const sy = clientY - rect.top;
    const worldX = (sx - state.camera.x) / state.camera.zoom;
    const worldY = (sy - state.camera.y) / state.camera.zoom;
    const newZoom = clamp(state.camera.zoom * factor, MIN_ZOOM, MAX_ZOOM);
    state.camera.x = sx - worldX * newZoom;
    state.camera.y = sy - worldY * newZoom;
    state.camera.zoom = newZoom;
    applyCamera();
    scheduleSave();
  }

  /* ============================================================
   * Empty-state hint
   * ========================================================== */

  function updateEmptyHint() {
    const empty = state.notes.length === 0 && state.strokes.length === 0;
    emptyHintEl.style.display = empty ? "block" : "none";
  }

  /* ============================================================
   * Notes: rendering
   * ========================================================== */

  function createNoteElement(note) {
    const el = document.createElement("div");
    el.className = "sticky-note";
    el.dataset.id = note.id;
    el.style.left = note.x + "px";
    el.style.top = note.y + "px";
    el.style.background = note.color;
    el.style.transform = "rotate(" + note.rot + "deg)";
    el.title = "クリックして編集 / ドラッグで移動";

    const text = document.createElement("div");
    text.className = "note-text";
    text.setAttribute("data-placeholder", "メモを入力…");
    text.textContent = note.text || "";
    el.appendChild(text);

    const toolbar = document.createElement("div");
    toolbar.className = "note-toolbar";

    const editBtn = document.createElement("button");
    editBtn.className = "note-edit-btn";
    editBtn.title = "編集";
    editBtn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M17 3.5a2.1 2.1 0 0 1 3 3L8 18.5l-4.5 1 1-4.5Z" /></svg>';
    editBtn.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
    });
    editBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      enterEditMode(note, text);
    });
    toolbar.appendChild(editBtn);

    NOTE_COLORS.forEach(function (color) {
      const dot = document.createElement("div");
      dot.className = "note-color-dot";
      dot.style.background = color;
      dot.addEventListener("pointerdown", function (e) {
        e.stopPropagation();
      });
      dot.addEventListener("click", function (e) {
        e.stopPropagation();
        note.color = color;
        lastUsedColor = color;
        el.style.background = color;
        scheduleSave();
      });
      toolbar.appendChild(dot);
    });
    const delBtn = document.createElement("button");
    delBtn.className = "note-delete-btn";
    delBtn.textContent = "✕";
    delBtn.title = "削除";
    delBtn.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
    });
    delBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      deleteNote(note.id);
    });
    toolbar.appendChild(delBtn);
    el.appendChild(toolbar);

    wireNoteInteractions(el, note, text);
    notesLayerEl.appendChild(el);
    return el;
  }

  function renderAllNotes() {
    notesLayerEl.innerHTML = "";
    state.notes.forEach(function (note) {
      createNoteElement(note);
    });
  }

  /* ============================================================
   * Notes: interaction (select / drag / edit / delete)
   * ========================================================== */

  function selectNote(id) {
    if (selectedNoteId === id) return;
    selectedNoteId = id;
    Array.prototype.forEach.call(notesLayerEl.children, function (el) {
      el.classList.toggle("selected", el.dataset.id === id);
    });
  }

  function deselectNote() {
    if (selectedNoteId === null) return;
    selectedNoteId = null;
    Array.prototype.forEach.call(notesLayerEl.children, function (el) {
      el.classList.remove("selected");
    });
  }

  function bringToFront(note) {
    const idx = state.notes.indexOf(note);
    if (idx === -1 || idx === state.notes.length - 1) return;
    state.notes.splice(idx, 1);
    state.notes.push(note);
    const el = notesLayerEl.querySelector('[data-id="' + note.id + '"]');
    if (el) notesLayerEl.appendChild(el);
  }

  function deleteNote(id) {
    const idx = state.notes.findIndex(function (n) { return n.id === id; });
    if (idx !== -1) state.notes.splice(idx, 1);
    const el = notesLayerEl.querySelector('[data-id="' + id + '"]');
    if (el) el.remove();
    if (selectedNoteId === id) selectedNoteId = null;
    updateEmptyHint();
    scheduleSave();
  }

  function placeCaretAtEnd(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function enterEditMode(note, textEl) {
    textEl.classList.add("editing");
    textEl.contentEditable = "true";
    textEl.focus();
    placeCaretAtEnd(textEl);
  }

  function exitEditMode(note, textEl) {
    textEl.classList.remove("editing");
    textEl.contentEditable = "false";
    note.text = textEl.textContent;
    scheduleSave();
  }

  function wireNoteInteractions(el, note, textEl) {
    let dragging = false;
    let moved = false;
    let startScreen = { x: 0, y: 0 };
    let startWorld = { x: 0, y: 0 };

    el.addEventListener("pointerdown", function (e) {
      if (currentTool !== "select") return;
      if (textEl.classList.contains("editing")) return; // let text editing behave normally
      e.stopPropagation();

      bringToFront(note);
      selectNote(note.id);

      dragging = true;
      moved = false;
      startScreen = { x: e.clientX, y: e.clientY };
      startWorld = { x: note.x, y: note.y };
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      const dx = e.clientX - startScreen.x;
      const dy = e.clientY - startScreen.y;
      if (!moved && Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) {
        moved = true;
        el.classList.add("dragging");
      }
      if (moved) {
        note.x = startWorld.x + dx / state.camera.zoom;
        note.y = startWorld.y + dy / state.camera.zoom;
        el.style.left = note.x + "px";
        el.style.top = note.y + "px";
      }
    });

    function releaseDrag(e) {
      dragging = false;
      el.classList.remove("dragging");
      try { el.releasePointerCapture(e.pointerId); } catch (err) { /* noop */ }
    }

    el.addEventListener("pointerup", function (e) {
      if (!dragging) return;
      const wasMoved = moved;
      releaseDrag(e);
      if (wasMoved) {
        scheduleSave();
      } else {
        // Pointer went down and up again without crossing the drag threshold:
        // treat it as a click on the note and start editing its text.
        enterEditMode(note, textEl);
      }
    });

    el.addEventListener("pointercancel", function (e) {
      if (!dragging) return;
      releaseDrag(e);
    });

    textEl.addEventListener("blur", function () {
      if (textEl.classList.contains("editing")) exitEditMode(note, textEl);
    });
  }

  function createNoteAt(worldX, worldY) {
    const note = {
      id: uid("note"),
      x: worldX - 95,
      y: worldY - 75,
      color: lastUsedColor,
      text: "",
      rot: Math.round((Math.random() * 4 - 2) * 10) / 10,
    };
    state.notes.push(note);
    const el = createNoteElement(note);
    bringToFront(note);
    selectNote(note.id);
    updateEmptyHint();
    scheduleSave();

    setTool("select");
    setTimeout(function () {
      const textEl = el.querySelector(".note-text");
      enterEditMode(note, textEl);
    }, 0);
  }

  /* ============================================================
   * Drawing: pen & eraser
   * ========================================================== */

  let isDrawing = false;
  let activeStroke = null;
  let activePolyline = null;

  function startStroke(worldPoint) {
    activeStroke = {
      id: uid("stroke"),
      color: PEN_COLOR,
      width: PEN_WIDTH,
      points: [[worldPoint.x, worldPoint.y]],
    };
    activePolyline = document.createElementNS(SVG_NS, "polyline");
    activePolyline.setAttribute("stroke", activeStroke.color);
    activePolyline.setAttribute("stroke-width", activeStroke.width);
    activePolyline.setAttribute("fill", "none");
    activePolyline.setAttribute("stroke-linecap", "round");
    activePolyline.setAttribute("stroke-linejoin", "round");
    activePolyline.dataset.id = activeStroke.id;
    updatePolylinePoints(activePolyline, activeStroke.points);
    svgEl.appendChild(activePolyline);
  }

  function extendStroke(worldPoint) {
    if (!activeStroke) return;
    activeStroke.points.push([worldPoint.x, worldPoint.y]);
    updatePolylinePoints(activePolyline, activeStroke.points);
  }

  function endStroke() {
    if (!activeStroke) return;
    if (activeStroke.points.length > 1) {
      state.strokes.push(activeStroke);
      updateEmptyHint();
      scheduleSave();
    } else {
      // single-point "tap" — drop a tiny dot so the click is not silently lost
      activeStroke.points.push([activeStroke.points[0][0] + 0.1, activeStroke.points[0][1] + 0.1]);
      state.strokes.push(activeStroke);
      updateEmptyHint();
      scheduleSave();
    }
    activeStroke = null;
    activePolyline = null;
  }

  function updatePolylinePoints(polyline, points) {
    polyline.setAttribute("points", points.map(function (p) { return p[0] + "," + p[1]; }).join(" "));
  }

  function renderAllStrokes() {
    svgEl.innerHTML = "";
    state.strokes.forEach(function (stroke) {
      const poly = document.createElementNS(SVG_NS, "polyline");
      poly.setAttribute("stroke", stroke.color);
      poly.setAttribute("stroke-width", stroke.width);
      poly.setAttribute("fill", "none");
      poly.setAttribute("stroke-linecap", "round");
      poly.setAttribute("stroke-linejoin", "round");
      poly.dataset.id = stroke.id;
      updatePolylinePoints(poly, stroke.points);
      svgEl.appendChild(poly);
    });
  }

  function eraseNear(worldPoint) {
    const radius = ERASER_RADIUS_SCREEN / state.camera.zoom;
    const radiusSq = radius * radius;
    let changed = false;

    for (let i = state.strokes.length - 1; i >= 0; i--) {
      const stroke = state.strokes[i];
      const hit = stroke.points.some(function (p) {
        const dx = p[0] - worldPoint.x;
        const dy = p[1] - worldPoint.y;
        return dx * dx + dy * dy <= radiusSq;
      });
      if (hit) {
        state.strokes.splice(i, 1);
        const el = svgEl.querySelector('[data-id="' + stroke.id + '"]');
        if (el) el.remove();
        changed = true;
      }
    }

    if (changed) {
      updateEmptyHint();
      scheduleSave();
    }
  }

  /* ============================================================
   * Tool switching
   * ========================================================== */

  function setTool(tool) {
    currentTool = tool;
    document.body.className = document.body.className
      .split(" ")
      .filter(function (c) { return c.indexOf("tool-") !== 0; })
      .join(" ")
      .trim();
    document.body.classList.add("tool-" + tool);

    Array.prototype.forEach.call(toolbarEl.querySelectorAll(".tool-btn[data-tool]"), function (btn) {
      btn.classList.toggle("active", btn.dataset.tool === tool);
    });

    if (tool !== "select") deselectNote();

    brushCursorEl.style.display = tool === "pen" || tool === "eraser" ? "block" : "none";
    updateBrushCursorSize();
  }

  function updateBrushCursorSize() {
    let diameter = 0;
    if (currentTool === "pen") {
      diameter = PEN_WIDTH * state.camera.zoom;
    } else if (currentTool === "eraser") {
      diameter = ERASER_RADIUS_SCREEN * 2;
    }
    diameter = Math.max(diameter, 6);
    brushCursorEl.style.width = diameter + "px";
    brushCursorEl.style.height = diameter + "px";
  }

  /* ============================================================
   * Viewport pointer handling (pan / draw / create note / select)
   * ========================================================== */

  let panning = false;
  let panStart = { x: 0, y: 0 };
  let camStart = { x: 0, y: 0 };
  let clickMoved = false;
  let spacePressed = false;

  function isBackgroundTarget(target) {
    return target === viewportEl || target === worldEl;
  }

  viewportEl.addEventListener("pointerdown", function (e) {
    // Middle-button or space-drag: pan regardless of tool.
    if (e.button === 1 || (spacePressed && e.button === 0)) {
      startPan(e);
      return;
    }

    if (currentTool === "select") {
      if (!isBackgroundTarget(e.target)) return;
      startPan(e);
      return;
    }

    if (currentTool === "pen") {
      if (e.button !== 0) return;
      isDrawing = true;
      viewportEl.setPointerCapture(e.pointerId);
      startStroke(screenToWorld(e.clientX, e.clientY));
      return;
    }

    if (currentTool === "eraser") {
      if (e.button !== 0) return;
      isDrawing = true;
      viewportEl.setPointerCapture(e.pointerId);
      eraseNear(screenToWorld(e.clientX, e.clientY));
      return;
    }
    // "note" tool: creation happens on click (see click listener below).
  });

  function startPan(e) {
    panning = true;
    clickMoved = false;
    panStart = { x: e.clientX, y: e.clientY };
    camStart = { x: state.camera.x, y: state.camera.y };
    viewportEl.classList.add("panning");
    viewportEl.setPointerCapture(e.pointerId);
  }

  viewportEl.addEventListener("pointermove", function (e) {
    // brush cursor follow
    if (currentTool === "pen" || currentTool === "eraser") {
      brushCursorEl.style.left = e.clientX + "px";
      brushCursorEl.style.top = e.clientY + "px";
    }

    if (panning) {
      const dx = e.clientX - panStart.x;
      const dy = e.clientY - panStart.y;
      if (Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) clickMoved = true;
      state.camera.x = camStart.x + dx;
      state.camera.y = camStart.y + dy;
      applyCamera();
      return;
    }

    if (isDrawing && currentTool === "pen") {
      extendStroke(screenToWorld(e.clientX, e.clientY));
      return;
    }

    if (isDrawing && currentTool === "eraser") {
      eraseNear(screenToWorld(e.clientX, e.clientY));
      return;
    }
  });

  function finishPointer(e) {
    if (panning) {
      panning = false;
      viewportEl.classList.remove("panning");
      try { viewportEl.releasePointerCapture(e.pointerId); } catch (err) { /* noop */ }
      if (!clickMoved && currentTool === "select" && isBackgroundTarget(e.target)) {
        deselectNote();
      }
      if (clickMoved) scheduleSave();
      return;
    }
    if (isDrawing) {
      isDrawing = false;
      try { viewportEl.releasePointerCapture(e.pointerId); } catch (err) { /* noop */ }
      if (currentTool === "pen") endStroke();
    }
  }

  viewportEl.addEventListener("pointerup", finishPointer);
  viewportEl.addEventListener("pointercancel", finishPointer);

  viewportEl.addEventListener("click", function (e) {
    if (currentTool !== "note") return;
    if (!isBackgroundTarget(e.target)) return;
    const worldPoint = screenToWorld(e.clientX, e.clientY);
    createNoteAt(worldPoint.x, worldPoint.y);
  });

  viewportEl.addEventListener(
    "wheel",
    function (e) {
      e.preventDefault();
      const factor = Math.exp(-e.deltaY * 0.0012);
      zoomAt(e.clientX, e.clientY, factor);
      updateBrushCursorSize();
    },
    { passive: false }
  );

  /* ============================================================
   * Toolbar wiring
   * ========================================================== */

  Array.prototype.forEach.call(toolbarEl.querySelectorAll(".tool-btn[data-tool]"), function (btn) {
    btn.addEventListener("click", function () {
      setTool(btn.dataset.tool);
    });
  });

  resetViewBtn.addEventListener("click", resetView);

  clearAllBtn.addEventListener("click", function () {
    const ok = window.confirm("すべての付箋と描画を消去します。この操作は取り消せません。よろしいですか？");
    if (!ok) return;
    state.notes = [];
    state.strokes = [];
    state.camera = { x: 0, y: 0, zoom: 1 };
    selectedNoteId = null;
    renderAllNotes();
    renderAllStrokes();
    applyCamera();
    updateEmptyHint();
    saveStateNow();
  });

  /* ============================================================
   * Keyboard shortcuts
   * ========================================================== */

  document.addEventListener("keydown", function (e) {
    const active = document.activeElement;
    const isEditingText = active && active.isContentEditable;

    if (e.code === "Space" && !isEditingText) {
      spacePressed = true;
      document.body.classList.add("space-pan");
      e.preventDefault();
      return;
    }

    if (isEditingText) {
      if (e.key === "Escape") active.blur();
      return;
    }

    if (e.key === "Escape") {
      deselectNote();
      return;
    }

    if ((e.key === "Delete" || e.key === "Backspace") && selectedNoteId) {
      deleteNote(selectedNoteId);
      return;
    }

    switch (e.key.toLowerCase()) {
      case "v":
        setTool("select");
        break;
      case "n":
        setTool("note");
        break;
      case "p":
        setTool("pen");
        break;
      case "e":
        setTool("eraser");
        break;
    }
  });

  document.addEventListener("keyup", function (e) {
    if (e.code === "Space") {
      spacePressed = false;
      document.body.classList.remove("space-pan");
    }
  });

  /* ============================================================
   * Lifecycle
   * ========================================================== */

  window.addEventListener("beforeunload", saveStateNow);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveStateNow();
  });

  function init() {
    loadState();
    renderAllNotes();
    renderAllStrokes();
    applyCamera();
    setTool("select");
    updateEmptyHint();
  }

  init();
})();
</script>
</body>
</html>
